name: Site

# GitHub Pages serves docs/ exactly as it is checked in, so the parts of the site that are generated
# have to be committed. This validates them on a pull request and regenerates the preset listing
# after a merge, so submitting a preset is two files and nothing else.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/site/**'
      - 'tools/gallery/**'
      - 'app/util/presetPackage.js'
      - 'app/presets/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/site/**'
      - 'tools/gallery/**'
      - 'app/util/presetPackage.js'
      - 'app/presets/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  check:
    name: Gallery and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A submission is credited to whoever committed it, which needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The tools reuse the app's own modules (presetPackage, adm-zip, semver, node-html-parser);
      # none of them needs a native build.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Validate the preset gallery
        run: node tools/gallery/build.js --check

      - name: Check the generated site assets
        run: node tools/site/build-assets.js --check

      - name: Check the site translations
        run: node tools/site/extract-strings.js --check

      - name: Check the release data
        run: node tools/site/release-data.js --check

      - name: Check the pages and the listing
        working-directory: app
        run: node --test ../test/site/gallery.test.js ../test/site/pages.test.js

      # A package is a zip: unreadable in a pull request diff. This prints what is inside the ones
      # this change touches, so a submission can be reviewed without downloading anything.
      - name: Review sheet for submitted presets
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- docs/gallery/community \
            | xargs -r -n1 basename | sed 's/\.[^.]*$//' | sort -u | paste -sd, -)
          if [ -n "$changed" ]; then
            node tools/gallery/build.js --report --only="$changed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No preset submission in this change." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Only after a merge, and only over code that is already on main: the listing is rebuilt from the
  # files in the repository and committed, so nobody has to run a command to submit a preset.
  listing:
    name: Rebuild the listing
    needs: check
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Rebuild docs/gallery/index.json
        run: node tools/gallery/build.js

      # The machine commits as the machine: a generated file is not the maintainer's work, and the
      # repository's own identity rule is about commits people write.
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- docs/gallery/index.json; then
            echo "The listing was already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/gallery/index.json
          git commit -m 'chore: rebuild the preset gallery listing'
          git push
