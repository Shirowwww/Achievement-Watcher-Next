name: Site

# GitHub Pages serves docs/ exactly as it is checked in, so the parts of the site that are generated
# have to be committed. This validates them on a pull request and rebuilds the preset and theme
# listings after a merge, so the copy the site falls back to always matches the files beside it.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'tools/site/**'
      - 'tools/gallery/**'
      - 'app/util/presetPackage.js'
      - 'app/util/themePackage.js'
      - 'app/util/themeMock.js'
      - 'app/presets/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'tools/site/**'
      - 'tools/gallery/**'
      - 'app/util/presetPackage.js'
      - 'app/util/themePackage.js'
      - 'app/util/themeMock.js'
      - 'app/presets/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  npm_config_audit: 'false'
  npm_config_fund: 'false'

jobs:
  check:
    name: Pages, gallery and discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The tools reuse the app's own modules (presetPackage, adm-zip, semver, node-html-parser);
      # none of them needs a native build.
      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Validate the preset gallery
        run: node tools/gallery/build.js --check

      - name: Validate the theme gallery
        run: node tools/gallery/build-themes.js --check

      - name: Check the generated site assets
        run: node tools/site/build-assets.js --check

      - name: Check the site translations
        run: node tools/site/extract-strings.js --check

      - name: Check the release data
        run: node tools/site/release-data.js --check

      - name: Check the published changelog
        run: node tools/site/changelog.js --check

      - name: Check search and feed discovery
        run: node tools/site/discovery.js --check

      - name: Check the pages and the listings
        working-directory: app
        run: node --test ../test/site/gallery.test.js ../test/site/themeGallery.test.js ../test/site/pages.test.js

  # Only after a merge, and only over code that is already on main: the listings are rebuilt from
  # the files in the repository and committed, so nobody has to run a command to publish one.
  listing:
    name: Rebuild the listings
    needs: check
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Rebuild the two listings
        run: |
          node tools/gallery/build.js
          node tools/gallery/build-themes.js

      # The machine commits as the machine: a generated file is not the maintainer's work, and the
      # repository's own identity rule is about commits people write.
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- docs/gallery/index.json docs/gallery/themes/index.json; then
            echo "Both listings were already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/gallery/index.json docs/gallery/themes/index.json
          git commit -m 'chore: rebuild the gallery listings'
          git push
