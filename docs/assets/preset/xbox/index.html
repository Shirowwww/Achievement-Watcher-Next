<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="style.css" />
<meta name="duration" content="6000" />
<meta width="474" height="126" />
<title>Xbox Notification</title>
<script src="../../js/preset-preview.js"></script>
</head><body>
<div class="ach"><div class="icon"><img src="" alt="" /></div><div class="text_wrap"><div class="meta" hidden><span class="game" hidden></span><span class="rarity" hidden></span></div><p class="title"></p><span class="detail"></span><div class="progress_line" hidden><span class="progress_track"><span class="progress_meter"></span></span><span class="progress_label"></span></div></div></div>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var root = document.querySelector('.ach');
  var metaDur = document.querySelector('meta[name="duration"]');
  var total = Math.max(600, Number((metaDur && metaDur.content) || 6000));
  // Timings live in the stylesheet, so the designer changes them by swapping the CSS alone.
  function timing(name, fallback) {
    try {
      var raw = getComputedStyle(root).getPropertyValue(name).trim();
      var value = parseFloat(raw);
      if (!isFinite(value)) return fallback;
      return raw.indexOf('ms') > -1 ? value : value * 1000;
    } catch (e) { return fallback; }
  }
  // A Windows path becomes a file URL; anything that already carries a scheme is left alone, so a
  // data: or https: image (the designer previews with data: URIs) is not turned into file:///data:.
  function fileUrl(value) {
    var p = String(value || '').replace(/\\/g, '/');
    if (!p) return '';
    return /^(?:file|data|https?|blob):/i.test(p) ? p : 'file:///' + p;
  }
  function applyState(data) {
    root.classList.remove('state-rare', 'state-platinum', 'tier-gold', 'tier-silver', 'tier-bronze');
    var type = String((data && data.notificationType) || '').toLowerCase();
    if ((data && data.isPlatinum) || type === 'platinum') { root.classList.add('state-platinum'); return; }
    if (type === 'progress' || type === 'playtime') return;
    // The host names the tier (rare tiers or trophy grades); the percentage is the fallback for a
    // host that does not send one, such as the designer preview.
    var tier = data && data.rarityTier;
    if (typeof tier === 'string') {
      if (tier === 'gold' || tier === 'silver' || tier === 'bronze') root.classList.add('state-rare', 'tier-' + tier);
      return;
    }
    // An ordinary unlock carries rarityPercent null, and Number(null) is 0 - which would make
    // every notification the rarest tier there is. Absence has to be checked before the number.
    var raw = data && data.rarityPercent;
    if (raw == null || raw === '') return;
    var percent = Number(raw);
    if (!isFinite(percent) || percent < 0 || percent > 15) return;
    root.classList.add('state-rare');
    root.classList.add(percent <= 5 ? 'tier-gold' : percent <= 10 ? 'tier-silver' : 'tier-bronze');
  }
  function applyArtwork(data) {
    var art = fileUrl((data && (data.imagePath || data.headerPath)) || (data && data.gameIconPath) || "");
    root.style.setProperty('--artwork', art ? 'url("' + art + '")' : 'none');
  }
  function normalizeProgress(data) {
    var src = (data && data.progress) || data || {};
    var max = Number(src.max != null ? src.max : src.progressMax);
    if (!isFinite(max) || max <= 1) return null;
    var currentRaw = Number(src.current != null ? src.current : src.progressCurrent);
    var current = Math.max(0, Math.min(max, isFinite(currentRaw) ? currentRaw : 0));
    var percentRaw = Number(src.percent != null ? src.percent : src.progressPercent);
    var percent = isFinite(percentRaw)
      ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
      : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
    return { current: current, max: max, percent: percent };
  }
  function applyProgress(data) {
    var line = document.querySelector('.progress_line');
    var meter = document.querySelector('.progress_meter');
    var label = document.querySelector('.progress_label');
    if (!line || !meter || !label) return;
    var progress = normalizeProgress(data);
    if (!progress) { line.hidden = true; meter.style.width = "0%"; label.textContent = ""; return; }
    line.hidden = false;
    meter.style.width = progress.percent + "%";
    label.textContent = progress.current + "/" + progress.max + " - " + progress.percent + "%";
  }
  /*
    A line too long for the card stays still long enough to be read from its start, scrolls to its
    end, rests there, then comes back, for as long as the card is up. The card stays up for one full
    pass of its longest line (capped), so the end of a long description is never cut off.
  */
  var MARQUEE_LEAD_MS = 2500;
  var MARQUEE_REST_MS = 1500;
  var MARQUEE_BACK_MS = 1200;
  var MARQUEE_MAX_TOTAL_MS = 15000;
  function marqueePlan(lineEl) {
    if (!lineEl) return null;
    try { lineEl.getAnimations().forEach(function (a) { a.cancel(); }); } catch (e) {}
    lineEl.classList.remove('marquee');
    void lineEl.offsetWidth;
    var clip = lineEl.closest('.text_wrap') || lineEl;
    var overflow = Math.round((lineEl.scrollWidth || 0) - (clip.clientWidth || 0));
    if (overflow <= 2) return null;
    var px = Math.ceil(overflow + 24);
    var scrollMs = Math.max(3000, Math.round((px / 50) * 1000));
    return { el: lineEl, px: px, scrollMs: scrollMs, readMs: MARQUEE_LEAD_MS + scrollMs + MARQUEE_REST_MS };
  }
  function startMarquee(plan) {
    if (!plan) return;
    var cycle = plan.readMs + MARQUEE_BACK_MS;
    var home = "translateX(0)";
    var end = "translateX(-" + plan.px + "px)";
    plan.el.classList.add('marquee');
    plan.el.animate([
      { transform: home, offset: 0 },
      { transform: home, offset: MARQUEE_LEAD_MS / cycle },
      { transform: end, offset: (MARQUEE_LEAD_MS + plan.scrollMs) / cycle },
      { transform: end, offset: plan.readMs / cycle },
      { transform: home, offset: 1 }
    ], { duration: cycle, easing: "linear", iterations: Infinity });
  }
  /*
    The line above the title (game name + rarity). Each half hides when the payload lacks it,
    and the whole row disappears when both do, so it never reserves an empty line.
  */
  function rarityText(data) {
    var percent = data && data.rarityPercent;
    if (percent == null || percent === '' || !isFinite(Number(percent))) return '';
    return (Math.round(Number(percent) * 10) / 10) + '%';
  }
  function applyMeta(data) {
    var row = document.querySelector('.meta');
    var gameEl = document.querySelector('.game');
    var rarityEl = document.querySelector('.rarity');
    if (!row || !gameEl || !rarityEl) return;
    var game = String((data && data.gameName) || '').trim();
    gameEl.textContent = game;
    gameEl.hidden = !game;
    var rarity = rarityText(data);
    rarityEl.textContent = rarity;
    rarityEl.hidden = !rarity;
    row.hidden = !game && !rarity;
  }
  // An added text that says {game}, {title}... gets those words here; {tier} is in the stylesheet.
  function applyTokens(words) {
    var spans = document.querySelectorAll('.aw-canvas [data-tok]');
    for (var i = 0; i < spans.length; i++) {
      var key = spans[i].getAttribute('data-tok');
      if (Object.prototype.hasOwnProperty.call(words, key)) spans[i].textContent = words[key];
    }
    var texts = document.querySelectorAll('.aw-canvas > [data-kind="text"]');
    for (var j = 0; j < texts.length; j++) texts[j].toggleAttribute('data-empty', saysNothing(texts[j]));
  }
  // A text made only of words this popup lacks, such as the rarity of a common unlock.
  function saysNothing(node) {
    if (node.textContent.trim() || !node.querySelector('[data-tok]')) return false;
    var tiers = node.querySelectorAll('[data-tok="tier"]');
    for (var i = 0; i < tiers.length; i++) {
      if (/^".+"$/.test(getComputedStyle(tiers[i], '::after').content)) return false;
    }
    return true;
  }
  /*
    A card line the design rewrote says its own words, the popup's in place of its {tokens}. Its
    stylesheet carries them encoded in --aw-text; a {tier} span is filled by the stylesheet.
  */
  var WORDED_LINES = { title: '.title', detail: '.detail', game: '.game', rarity: '.rarity' };
  var lineWords = {};
  function lineTemplate(node) {
    var raw = getComputedStyle(node).getPropertyValue('--aw-text').trim();
    if (raw.length < 2 || raw.charAt(0) !== '"') return null;
    try { return decodeURIComponent(raw.slice(1, -1)); } catch (e) { return null; }
  }
  function writeLine(node, template) {
    node.textContent = '';
    var pieces = template.split(/\{(game|title|detail|rarity|tier)\}/);
    for (var i = 0; i < pieces.length; i++) {
      if (i % 2 === 0) {
        if (pieces[i]) node.appendChild(document.createTextNode(pieces[i]));
        continue;
      }
      var span = document.createElement('span');
      span.setAttribute('data-tok', pieces[i]);
      if (pieces[i] !== 'tier') span.textContent = lineWords[pieces[i]] || '';
      node.appendChild(span);
    }
  }
  function applyWords(words) {
    if (words) lineWords = words;
    applyTokens(lineWords);
    for (var key in WORDED_LINES) {
      var node = document.querySelector(WORDED_LINES[key]);
      if (!node) continue;
      var template = lineTemplate(node);
      if (template != null) writeLine(node, template);
      else if (node.awWritten) node.textContent = lineWords[key] || '';
      node.awWritten = template != null;
    }
  }
  // The designer swaps the stylesheet or the items in place: the words follow without a new payload.
  window.awWords = function () { applyWords(); };
  /*
    A line the stylesheet marks is typed out (--aw-type) or counted up (--aw-count) as the card comes
    in. A typed line is cut into one span per letter, which the stylesheet shows each in turn; a
    counted one has its numbers rewritten from the progress of its own CSS animation. Both keep the
    timing the design gave them, and stand still with that animation when the designer holds it.
  */
  var MOTION_LINES = '.title, .detail, .game, .rarity, .progress_label, .aw-canvas > [data-kind="text"]';
  var graphemes = window.Intl && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  var counted = [];
  var countFrame = 0;
  function marked(node, name) {
    return getComputedStyle(node).getPropertyValue(name).trim() === '1';
  }
  function textNodes(node) {
    var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    var found = [];
    while (walker.nextNode()) found.push(walker.currentNode);
    return found;
  }
  function untype(node) {
    var letters = node.querySelectorAll('.aw-ch');
    for (var i = 0; i < letters.length; i++) letters[i].replaceWith(letters[i].textContent);
    node.normalize();
  }
  function typeOut(node) {
    var n = 0;
    textNodes(node).forEach(function (text) {
      var pieces = graphemes ? Array.from(graphemes.segment(text.data), function (s) { return s.segment; }) : Array.from(text.data);
      var run = document.createDocumentFragment();
      pieces.forEach(function (piece) {
        var letter = document.createElement('span');
        letter.className = 'aw-ch';
        letter.style.setProperty('--aw-i', String(n));
        letter.textContent = piece;
        run.appendChild(letter);
        n += 1;
      });
      text.replaceWith(run);
    });
    node.style.setProperty('--aw-n', String(Math.max(1, n)));
  }
  // Every number counts up from zero but a total after a slash ("3/10"); figure spaces in front keep
  // the line as wide as it ends.
  function countedText(text, at) {
    return text.replace(/(\/\s*)?(\d+)(?:([.,])(\d+))?/g, function (all, total, whole, mark, part) {
      if (total) return all;
      var shown = (Number(whole + (part ? '.' + part : '')) * at).toFixed(part ? part.length : 0);
      var pad = Math.max(0, whole.length - shown.split('.')[0].length);
      return new Array(pad + 1).join('\u2007') + (mark ? shown.replace('.', mark) : shown);
    });
  }
  // Where its count animation stands, eased; 1 once it has none (reduced motion, or no count).
  function countAt(line) {
    var anims = line.getAnimations();
    for (var i = 0; i < anims.length; i++) {
      if (anims[i].animationName !== 'aw-cv-count') continue;
      var p = anims[i].effect.getComputedTiming().progress;
      return { at: p == null ? 0 : 1 - Math.pow(1 - p, 3), running: anims[i].playState === 'running' };
    }
    return { at: 1, running: false };
  }
  // Writes the counted lines as their animations stand; true while one of them is still counting.
  function syncCounts() {
    var running = false;
    counted.forEach(function (entry) {
      var now = countAt(entry.line);
      running = running || now.running;
      var text = now.at >= 1 ? entry.data : countedText(entry.data, now.at);
      if (entry.node.data !== text) entry.node.data = text;
    });
    return running;
  }
  function tickCounts() {
    cancelAnimationFrame(countFrame);
    if (syncCounts()) countFrame = requestAnimationFrame(tickCounts);
  }
  function prepareMotion() {
    counted.forEach(function (entry) { entry.node.data = entry.data; });
    counted = [];
    var lines = document.querySelectorAll(MOTION_LINES);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      untype(line);
      if (marked(line, '--aw-type')) typeOut(line);
      else if (marked(line, '--aw-count')) textNodes(line).forEach(function (node) { counted.push({ line: line, node: node, data: node.data }); });
    }
  }
  // The designer holds the card at a moment of its own, then has the counted lines written for it.
  window.awMotionSync = syncCounts;
  // An animated picture set to replay starts over as it appears: a new address is a new animation,
  // swapped in once loaded so the element never shows a gap. A picture held inline (the
  // designer preview) gets its new address from a parameter of its media type.
  var replayTimers = [];
  var replayCount = 0;
  function restartPicture(node) {
    node.style.backgroundImage = '';
    var match = /^url\("(.+)"\)$/.exec(getComputedStyle(node).backgroundImage);
    if (!match) return;
    replayCount += 1;
    var next = match[1].indexOf('data:') === 0
      ? match[1].replace(/^data:([^;,]*)(;replay=\d+)?/, 'data:$1;replay=' + replayCount)
      : match[1].replace(/[?#].*$/, '') + '?replay=' + replayCount;
    var picture = new Image();
    picture.onload = function () { node.style.backgroundImage = 'url("' + next + '")'; };
    picture.src = next;
  }
  function replayPictures() {
    replayTimers.forEach(clearTimeout);
    var nodes = document.querySelectorAll('.aw-canvas [data-replay]');
    replayTimers = Array.prototype.map.call(nodes, function (node) {
      return setTimeout(function () { restartPicture(node); }, Number(node.getAttribute('data-replay')) || 0);
    });
  }
  /*
    A see-through shape cuts through what lies under it: the card, the parts and the items below
    it in the stacking order. Each of those gets a mask in its own pixels with the shapes taken
    out. Probes measure where each one really is, moved, turned or flipped, with its animations
    held at rest meanwhile; the card itself is the frame both sides are measured in.
  */
  var CUT_MARGIN = 400;
  var CUT_MAX_TRIES = 25;
  var CUT_RETRY_MS = 80;
  var CUT_LAYERS = '.aw-canvas > .aw-card, .icon, .meta, .title, .detail, .progress_line, .aw-canvas > [data-i]:not([data-cut])';
  var MASK_PROPS = ['mask-image', 'mask-position', 'mask-size', 'mask-repeat', 'mask-clip'];
  var cutMasked = [];
  var cutTimer = null;
  var cutTries = 0;
  function drawn(node) { return node.getClientRects().length > 0; }
  function moved(style) {
    return style.transform !== 'none' || style.translate !== 'none' || style.rotate !== 'none' || style.scale !== 'none' || style.filter !== 'none';
  }
  // Where a node paints in the card: its own z-index, or that of the outermost stacking context
  // it sits in. A plain in-flow node paints between the negative ones and the rest.
  function rankOf(node) {
    var rank = 0;
    for (var at = node; at && at !== root; at = at.parentElement) {
      var style = getComputedStyle(at);
      var z = style.zIndex === 'auto' ? null : Number(style.zIndex);
      var context = z !== null || moved(style) || Number(style.opacity) < 1 || style.isolation === 'isolate';
      if (at === node) rank = z !== null ? z : (context || style.position !== 'static' ? 0 : -0.5);
      else if (context) rank = z !== null ? z : 0;
    }
    return rank;
  }
  // Every running animation of the nodes and of what holds them in the card, held at rest.
  function holdStill(nodes) {
    var undo = [];
    var seen = [];
    nodes.forEach(function (node) {
      for (var at = node; at && at !== root && seen.indexOf(at) < 0; at = at.parentElement) {
        seen.push(at);
        at.getAnimations().forEach(function (anim) {
          if (anim.playState !== 'running') return;
          var time = anim.currentTime;
          var timing = anim.effect && anim.effect.getComputedTiming();
          anim.pause();
          anim.currentTime = timing && isFinite(timing.endTime) ? timing.endTime : 0;
          undo.push(function () { anim.currentTime = time; anim.play(); });
        });
      }
    });
    return function () { undo.forEach(function (fn) { fn(); }); };
  }
  // Three probes in the node give the map from its own pixels to the window, whatever moves it.
  function placeProbes(node) {
    var style = getComputedStyle(node);
    var loose = style.position === 'static' && !moved(style);
    var before = node.style.getPropertyValue('position');
    if (loose) node.style.setProperty('position', 'relative');
    var probes = [[0, 0], [100, 0], [0, 100]].map(function (at) {
      var probe = document.createElement('i');
      probe.style.cssText = 'position: absolute; display: block; left: ' + at[0] + 'px; top: ' + at[1] + 'px; width: 0; height: 0; margin: 0; padding: 0; border: 0;';
      node.appendChild(probe);
      return probe;
    });
    return {
      node: node,
      probes: probes,
      restore: function () { probes.forEach(function (probe) { probe.remove(); }); if (loose) node.style.setProperty('position', before); },
    };
  }
  function frameOf(entry) {
    var at = entry.probes.map(function (probe) { return probe.getBoundingClientRect(); });
    return new DOMMatrix([(at[1].left - at[0].left) / 100, (at[1].top - at[0].top) / 100, (at[2].left - at[0].left) / 100, (at[2].top - at[0].top) / 100, at[0].left, at[0].top])
      .translate(-entry.node.clientLeft, -entry.node.clientTop);
  }
  function clearCuts() {
    cutMasked.forEach(function (node) { MASK_PROPS.forEach(function (prop) { node.style.removeProperty(prop); }); });
    cutMasked = [];
  }
  // White keeps, the shapes in black take out; room around the box keeps a shadow or a glow.
  function maskOut(node, shapes) {
    var m = CUT_MARGIN;
    var w = node.offsetWidth + 2 * m;
    var h = node.offsetHeight + 2 * m;
    var box = 'x="' + -m + '" y="' + -m + '" width="' + w + '" height="' + h + '"';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="' + -m + ' ' + -m + ' ' + w + ' ' + h + '">' +
      '<mask id="c" maskUnits="userSpaceOnUse" ' + box + '><rect ' + box + ' fill="#fff"/><g fill="#000">' + shapes + '</g></mask>' +
      '<rect ' + box + ' mask="url(#c)"/></svg>';
    node.style.setProperty('mask-image', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")', 'important');
    node.style.setProperty('mask-position', -m + 'px ' + -m + 'px', 'important');
    node.style.setProperty('mask-size', w + 'px ' + h + 'px', 'important');
    node.style.setProperty('mask-repeat', 'no-repeat', 'important');
    node.style.setProperty('mask-clip', 'no-clip', 'important');
    cutMasked.push(node);
  }
  function cutHoles() {
    clearTimeout(cutTimer);
    clearCuts();
    var holes = Array.prototype.filter.call(root.querySelectorAll('.aw-canvas > [data-cut]'), function (hole) {
      return drawn(hole) && getComputedStyle(hole).getPropertyValue('--aw-cut-off').trim() !== '1';
    });
    if (!holes.length) return;
    var layers = Array.prototype.filter.call(root.querySelectorAll(CUT_LAYERS), drawn);
    var nodes = holes.concat(layers);
    var resume = holdStill(nodes);
    var entries = nodes.map(placeProbes);
    var frames = entries.map(frameOf);
    entries.forEach(function (entry) { entry.restore(); });
    resume();
    // A card scaled to nothing as it comes in has no frame to measure in yet.
    if (frames.some(function (f) { return Math.abs(f.a * f.d - f.b * f.c) < 1e-6; })) {
      cutTries += 1;
      if (cutTries < CUT_MAX_TRIES) cutTimer = setTimeout(cutHoles, CUT_RETRY_MS);
      return;
    }
    var ranks = nodes.map(rankOf);
    layers.forEach(function (node, k) {
      var mine = frames[holes.length + k].inverse();
      var rank = ranks[holes.length + k];
      var shapes = '';
      holes.forEach(function (hole, i) {
        var over = ranks[i] > rank || (ranks[i] === rank && Boolean(node.compareDocumentPosition(hole) & 4));
        if (!over) return;
        var t = mine.multiply(frames[i]);
        var matrix = [t.a, t.b, t.c, t.d, t.e, t.f].map(function (v) { return Math.round(v * 1000) / 1000; });
        shapes += '<g transform="matrix(' + matrix.join(' ') + ')">' + hole.getAttribute('data-cut') + '</g>';
      });
      if (shapes) maskOut(node, shapes);
    });
  }
  function recut() {
    cutTries = 0;
    cutHoles();
  }
  // The designer redraws the card in place, without a new payload.
  window.awCutHoles = recut;
  var closeTimer = null;
  function onPayload(displayName, description, iconPath, scale, data) {
    var titleEl = document.querySelector('.title');
    var detailEl = document.querySelector('.detail');
    var iconEl = document.querySelector('.icon img');
    if (displayName != null) titleEl.textContent = displayName;
    if (description != null) detailEl.textContent = description;
    if (iconPath) { iconEl.src = fileUrl(iconPath); iconEl.style.display = "block"; }
    else { iconEl.style.display = 'none'; }
    var s = Math.max(0.01, parseFloat(scale || 1) || 1);
    root.style.setProperty('--scale', String(s));
    applyState(data);
    root.classList.toggle('is-hidden', data.hidden === true);
    applyArtwork(data);
    applyMeta(data);
    applyProgress(data);
    var words = { game: String(data.gameName || '').trim(), title: displayName != null ? String(displayName) : lineWords.title || '', detail: description != null ? String(description) : lineWords.detail || '', rarity: rarityText(data) };
    applyWords(words);
    prepareMotion();
    var inMs = timing('--ach-in', 520);
    var outMs = timing('--ach-out', 380);
    var marquees = [marqueePlan(titleEl), marqueePlan(detailEl)];
    var readMs = Math.max(0, (marquees[0] || {}).readMs || 0, (marquees[1] || {}).readMs || 0);
    var shownMs = readMs > 0 ? Math.max(total, Math.min(inMs + readMs + outMs, MARQUEE_MAX_TOTAL_MS)) : total;
    var holdMs = Math.max(0, shownMs - inMs - outMs);
    root.style.setProperty('--ach-hold', holdMs + 'ms');
    root.classList.remove('active');
    void root.offsetWidth;
    root.classList.add('active');
    tickCounts();
    recut();
    // A font that lands later moves the lines it sets, and the cuts made in them.
    if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(recut);
    replayPictures();
    if (window.api && window.api.notificationRenderReady) window.api.notificationRenderReady();
    requestAnimationFrame(function () { marquees.forEach(startMarquee); });
    clearTimeout(closeTimer);
    closeTimer = setTimeout(function () {
      root.classList.remove('active');
      if (window.api && window.api.closeNotificationWindow) window.api.closeNotificationWindow();
    }, shownMs);
  }
  if (window.api && window.api.onNotification) window.api.onNotification(function (d) {
    onPayload(d && d.displayName, d && d.description, d && (d.iconPath || d.icon), d && d.scale, d || {});
  });
});
</script>
</body></html>
