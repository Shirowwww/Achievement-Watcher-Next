# GitHub Pages builds this folder (Settings -> Pages -> Source: main, /docs).
#
# Everything the site serves has to live under this folder, because it is the publish root:
# screenshots are in docs/screenshot/, and links to files above it (README, BUILD, SECURITY,
# CONTRIBUTING, CHANGELOG) are absolute GitHub URLs rather than ../ paths.
#
# The site is two things published side by side:
#
#   index.html and gallery/index.html   hand written pages, static files with no front matter, so
#                                       Jekyll copies them out untouched. They share
#                                       assets/css/site.css and are what a visitor lands on.
#   every .md in this folder            the guides, rendered by the Primer theme. They stay the
#                                       single source of truth: what GitHub shows when browsing the
#                                       repository is what the site publishes.
#
# No layout or Liquid template is added to the Markdown on purpose. assets/css/style.scss imports
# the theme and applies the app's palette, and _includes/head-custom.html adds the favicon, the
# theme toggle and the bar that links the guides back to the rest of the site - styling and
# navigation only, so browsing the same files on GitHub is unaffected.
#
# Two plugins that ship with GitHub Pages do the rest without any configuration:
#   jekyll-relative-links         [x](getting-started.md) resolves to the built page
#   jekyll-optional-front-matter  files without front matter are still rendered as pages

theme: jekyll-theme-primer

title: Achievement Watcher Next
description: Setup, sources, notifications, presets and troubleshooting for AW Next.
lang: en

# jekyll-readme-index turns README.md into the site index when there is no index page. There is one
# now - the home page - so the plugin is switched off rather than left to decide: with it enabled
# the two would both claim "/", and the guides hub is published at README.html instead, which is
# where app/util/links.js sends the app's Documentation button.
readme_index:
  enabled: false

# GitHub re-enables Markdown after a blank line inside a block-level HTML element; kramdown, which
# is what Jekyll uses here, does not unless it is told to. Every page centres its header, its
# screenshots and its footer nav in a <div>/<p>, so without this the site serves the contents of
# those blocks as raw text - literal [label](url) instead of links. This makes the two renderers
# agree, and keeps the fix in one line rather than markdown="1" on every block in every file.
kramdown:
  parse_block_html: true

# The repository is a monorepo for a desktop app; only this folder is published, but be explicit so
# a stray file added here later is not served by accident.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
