<!--
  The bar that puts a guide back inside the site: the same links in the same order as the home
  page's own header, and the same split - links are navigation, the theme switch and Download are
  actions. It is drawn here rather than written into every Markdown file, so browsing those files on
  github.com is unaffected. On a phone the links and the guide list move into one menu, opened by
  the button at the left; with scripting off the button does nothing and the links stay in view.
-->
<header class="aw-site-bar">
  <div class="aw-site-bar-inner">
    <button class="aw-menu-toggle" type="button" aria-expanded="false" aria-controls="aw-guides" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z" /></svg>
    </button>
    <a class="aw-site-brand" href="{{ '/' | relative_url }}" aria-label="Achievement Watcher Next">
      <span class="aw-site-mark" aria-hidden="true"></span>
      <span class="aw-site-brand-word">Achievement Watcher <em>Next</em></span>
    </a>
    <nav class="aw-site-links" aria-label="Site">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/README.html' | relative_url }}" aria-current="{% if page.name == 'README.md' %}page{% else %}false{% endif %}">Guides</a>
      <a href="{{ '/gallery/' | relative_url }}">Presets</a>
      <a href="{{ '/gallery/themes/' | relative_url }}">Themes</a>
      <a href="https://github.com/Shirowwww/Achievement-Watcher-Next">GitHub</a>
    </nav>
    <div class="aw-site-actions">
      <button class="aw-theme-toggle" type="button" aria-label="Switch theme" data-theme-toggle></button>
      <a class="aw-site-cta" href="https://github.com/Shirowwww/Achievement-Watcher-Next/releases/latest">Download</a>
    </div>
  </div>
</header>
