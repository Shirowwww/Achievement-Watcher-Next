<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Popup Animation</title>
    <meta name="duration" content="7500" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <meta width="450" height="150" />
    <div class="ach">
      <div class="icon">
        <img src="" alt="Icon" />
      </div>
      <div class="text_wrap">
        <p class="title"><span class="title-inner"></span></p>
        <span class="detail"></span>
        <div class="progress_line" hidden>
          <span class="progress_track"><span class="progress_meter"></span></span>
          <span class="progress_label"></span>
        </div>
      </div>
      <div class="ring-container">
        <div class="ringring"></div>
        <div class="circle">
          <img src="./psicon.png" height="21" />
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const metaDur = document.querySelector('meta[name="duration"]');
        const baseTotal = Math.max(1, Number(metaDur?.content || 4000));
        function notifyScreenshotReady(delayMs = 0) {
          const safeDelay = Math.max(0, Number(delayMs) || 0);
          setTimeout(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.api?.notificationRenderReady?.();
              });
            });
          }, safeDelay);
        }
        function applyRarityTier(rootEl, value) {
          rootEl?.classList.remove("rarity-gold", "rarity-silver", "rarity-bronze");
          if (value == null || value === "") return;
          const percent = Number(value);
          if (!Number.isFinite(percent) || percent < 0 || percent > 15) return;
          if (percent <= 5) rootEl.classList.add("rarity-gold");
          else if (percent <= 10) rootEl.classList.add("rarity-silver");
          else rootEl.classList.add("rarity-bronze");
        }
        function normalizeProgress(data) {
          const src = data?.progress || data || {};
          const max = Number(src.max ?? src.progressMax);
          if (!Number.isFinite(max) || max <= 1) return null;
          const currentRaw = Number(src.current ?? src.progressCurrent);
          const current = Math.max(
            0,
            Math.min(max, Number.isFinite(currentRaw) ? currentRaw : 0)
          );
          const percentRaw = Number(src.percent ?? src.progressPercent);
          const percent = Number.isFinite(percentRaw)
            ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
            : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
          return { current, max, percent };
        }
        function applyProgress(data) {
          const progress = normalizeProgress(data);
          const line = document.querySelector(".progress_line");
          const meter = document.querySelector(".progress_meter");
          const label = document.querySelector(".progress_label");
          if (!line || !meter || !label) return;
          if (!progress) {
            line.hidden = true;
            meter.style.width = "0%";
            label.textContent = "";
            return;
          }
          line.hidden = false;
          meter.style.width = `${progress.percent}%`;
          label.textContent = `${progress.current}/${progress.max} - ${progress.percent}%`;
        }
        window.api.onNotification((notificationData) => {
          const titleEl = document.querySelector(".title");
          const titleInnerEl = document.querySelector(".title-inner");
          const detailEl = document.querySelector(".detail");
          const container = document.querySelector(".ach");
          if (notificationData) {
            if (notificationData.displayName != null) {
              titleInnerEl.textContent = notificationData.displayName;
            }
            if (notificationData.description != null) {
              detailEl.textContent = notificationData.description;
            }
            if (notificationData.iconPath) {
              const p = String(notificationData.iconPath).replace(/\\/g, "/");
              document.querySelector(".icon img").src = p.startsWith("file://")
                ? p
                : `file:///${p}`;
            }
            const scale = Math.max(
              0.01,
              parseFloat(notificationData.scale || 1),
            );
            container?.style?.setProperty("--scale", String(scale));
            applyRarityTier(container, notificationData.rarityPercent);
            applyProgress(notificationData);
          }
          const total = Math.max(0, Number(metaDur?.content || baseTotal));
          const timelineScale = Math.max(0.1, total / baseTotal);
          const inDur = Math.max(120, Math.round(300 * timelineScale));
          const outDur = Math.max(120, Math.round(300 * timelineScale));
          const outDelay = Math.max(0, total - outDur);
          container?.style?.setProperty("--inDur", `${inDur}ms`);
          container?.style?.setProperty("--outDur", `${outDur}ms`);
          container?.style?.setProperty("--outDelay", `${outDelay}ms`);
          container?.style?.setProperty(
            "--timeline-scale",
            String(timelineScale),
          );
          container.classList.add("active");
          notifyScreenshotReady(inDur + 60);

          // Title marquee only if overflows
          requestAnimationFrame(() => {
            try {
              titleInnerEl.getAnimations().forEach((a) => a.cancel());
            } catch {}
            titleEl.classList.remove("marquee");
            void titleEl.offsetWidth;
            const overflowX =
              (titleInnerEl.scrollWidth || 0) - (titleEl.clientWidth || 0);
            if (overflowX > 0) {
              const px = Math.ceil(overflowX + 24);
              titleEl.classList.add("marquee");
              titleInnerEl.animate(
                [
                  { transform: "translateX(0)" },
                  { transform: `translateX(-${px}px)` },
                ],
                {
                  duration: Math.max(3000, Math.round(px / 50) * 1000),
                  delay: 1200,
                  easing: "linear",
                  fill: "both",
                },
              );
            }
          });

          setTimeout(() => {
            container.classList.remove("active");
            window.api.closeNotificationWindow();
          }, total);
        });
      });
    </script>
  </body>
</html>
