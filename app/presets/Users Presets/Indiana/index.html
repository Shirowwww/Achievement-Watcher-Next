<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Popup Animation</title>
    <meta name="duration" content="8000" />

    <style>
      html,
      body {
        margin:  0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;

        display: flex;
        align-items: center;
        justify-content: right;
        margin-right: 20px;
      }

      body {
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <meta width="570" height="150" />
    <div class="ach">
      <div class="icon">
        <img src="" alt="Icon" />
      </div>
      <div class="text_wrap">
        <p class="title"></p>
        <span class="detail"></span>
        <div class="progress_line" hidden>
          <span class="progress_track"><span class="progress_meter"></span></span>
          <span class="progress_label"></span>
        </div>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector(".ach");
        const titleEl = document.querySelector(".title");
        const detailEl = document.querySelector(".detail");
        const iconEl = document.querySelector(".icon img");
        const docEl = document.documentElement;
        const durationMeta = document.querySelector('meta[name="duration"]');
        const getCloseDelay = () =>
          Math.max(0, Number(durationMeta?.content || 8000));
        docEl.style.setProperty("--displaytime", `${getCloseDelay()}ms`);

        applyScale(1);

        function applyScale(inputScale) {
          const numeric = parseFloat(inputScale);
          const safeScale =
            Number.isFinite(numeric) && numeric > 0 ? numeric : 1;
          docEl.style.setProperty("--scale", String(safeScale));
        }

        function subscribe(handler) {
          if (window.api && typeof window.api.onNotification === "function") {
            window.api.onNotification(handler);
            return true;
          }
          if (
            window.electronAPI &&
            typeof window.electronAPI.onNotification === "function"
          ) {
            window.electronAPI.onNotification(handler);
            return true;
          }
          return false;
        }

        function closeWindow() {
          window.api?.closeNotificationWindow?.();
          window.electronAPI?.closeNotificationWindow?.();
        }

        function notifyScreenshotReady(delayMs = 0) {
          const safeDelay = Math.max(0, Number(delayMs) || 0);
          setTimeout(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.api?.notificationRenderReady?.();
              });
            });
          }, safeDelay);
        }

        function applyRarityTier(rootEl, value) {
          rootEl?.classList.remove("rarity-gold", "rarity-silver", "rarity-bronze");
          if (value == null || value === "") return;
          const percent = Number(value);
          if (!Number.isFinite(percent) || percent < 0 || percent > 15) return;
          if (percent <= 5) rootEl.classList.add("rarity-gold");
          else if (percent <= 10) rootEl.classList.add("rarity-silver");
          else rootEl.classList.add("rarity-bronze");
        }

        function normalizeProgress(data) {
          const src = data?.progress || data || {};
          const max = Number(src.max ?? src.progressMax);
          if (!Number.isFinite(max) || max <= 1) return null;
          const currentRaw = Number(src.current ?? src.progressCurrent);
          const current = Math.max(
            0,
            Math.min(max, Number.isFinite(currentRaw) ? currentRaw : 0)
          );
          const percentRaw = Number(src.percent ?? src.progressPercent);
          const percent = Number.isFinite(percentRaw)
            ? Math.max(0, Math.min(100, Math.floor(percentRaw)))
            : Math.max(0, Math.min(100, Math.floor((current / max) * 100)));
          return { current, max, percent };
        }

        function applyProgress(data) {
          const progress = normalizeProgress(data);
          const line = document.querySelector(".progress_line");
          const meter = document.querySelector(".progress_meter");
          const label = document.querySelector(".progress_label");
          if (!line || !meter || !label) return;
          if (!progress) {
            line.hidden = true;
            meter.style.width = "0%";
            label.textContent = "";
            return;
          }
          line.hidden = false;
          meter.style.width = `${progress.percent}%`;
          label.textContent = `${progress.current}/${progress.max} - ${progress.percent}%`;
        }

        function startMarqueeIfOverflow(lineEl) {
          try {
            lineEl.getAnimations().forEach((a) => a.cancel());
          } catch {}
          lineEl.classList.remove("marquee");
          void lineEl.offsetWidth;
          const clip = lineEl.closest(".text_wrap") || lineEl;
          const overflow = Math.round(
            (lineEl.scrollWidth || 0) - (clip.clientWidth || 0)
          );
          if (overflow > 2) {
            const px = Math.ceil(overflow + 24);
            lineEl.classList.add("marquee");
            lineEl.animate(
              [
                { transform: "translateX(0)" },
                { transform: `translateX(-${px}px)` },
              ],
              {
                duration: Math.max(3000, Math.round(px / 50) * 1000),
                delay: 1000,
                easing: "linear",
                fill: "both",
              }
            );
          }
        }

        function restartAnimation() {
          if (!container) return;
          container.classList.remove("is-active");
          void container.offsetWidth;
          container.classList.add("is-active");
        }

        const subscribed =
          container &&
          titleEl &&
          detailEl &&
          iconEl &&
          subscribe((notificationData) => {
            if (notificationData) {
              if (notificationData.displayName) {
                titleEl.textContent = notificationData.displayName;
              }
              if (notificationData.description) {
                detailEl.textContent = notificationData.description;
              }
              const rawIcon =
                notificationData.iconPath || notificationData.icon;
              if (rawIcon) {
                const normalized = String(rawIcon).replace(/\\/g, "/");
                iconEl.src = normalized.startsWith("file://")
                  ? normalized
                  : `file:///${normalized}`;
              }
            }

            applyScale(notificationData?.scale ?? 1);
            applyRarityTier(container, notificationData?.rarityPercent);
            applyProgress(notificationData);

            restartAnimation();
            notifyScreenshotReady(360);
            requestAnimationFrame(() => {
              startMarqueeIfOverflow(titleEl);
              startMarqueeIfOverflow(detailEl);
            });

            const closeDelay = getCloseDelay();
            docEl.style.setProperty("--displaytime", `${closeDelay}ms`);
            setTimeout(() => {
              container?.classList.remove("is-active");
              closeWindow();
            }, closeDelay);
          });

        if (!subscribed) {
          applyScale(1);
        }
      });
    </script>
  </body>
</html>
