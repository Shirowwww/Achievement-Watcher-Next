# `appId` is the AppUserModelID Windows matches toasts and taskbar pins against. It must not change
# or every existing install loses its notification identity.
#
# `productName` and `executableName` are split on purpose:
#   productName      is what people read. electron-builder writes it into the executable's
#                    FileDescription and ProductName, which is the name Task Manager shows, and
#                    uses it for the installer's own branding text.
#   executableName   pins everything an existing install is keyed on - the executable filename
#                    ("Achievement Watcher.exe"), the installation directory and the uninstaller
#                    filename. The "Start with Windows" entry written by app/electron/ipc.js stores
#                    the full path of that executable, so renaming it silently kills autostart and
#                    leaves a dead registry value behind; the Watchdog also spawns the app by that
#                    exact filename.
appId: io.github.shirowwww.achievement.watcher
productName: 'Achievement Watcher Next'
executableName: 'Achievement Watcher'
npmRebuild: false

# Copies watchdog/node_modules into the packed app. electron-builder's
# extraFiles object form drops node_modules, which otherwise leaves the
# Watchdog unable to start after install (missing @xan105/log etc.).
afterPack: ./build/afterPack.js

# Overlay notification presets and sounds must live on disk (not inside app.asar) so the
# notification window can loadFile() preset HTML and play sound files via file:// URLs.
asarUnpack:
  - presets/**
  - sounds/**
  # Keep the plain repair DLLs and their recovery archive accessible outside the virtual asar layer.
  - resources/uplayR2/**
  - resources/uplayR1/**
  # Shared modules loaded by the standalone Watchdog (which runs from the install dir) through
  # watchdog/util/sharedAppModule.js - anything required that way must be listed here.
  - util/notificationPreset.js
  - util/gameTitle.js
  - util/steamSchemaFetch.js
  - util/localIcons.js
  - util/imageSize.js
  - util/imageSniff.js
  - parser/achievementTranslations.js
  - parser/steamAppInfo.js
  - parser/ff7.js
  - assets/ff7-achievements.json
  - assets/uplay-steam.json
  - parser/uplaySteamTable.js
  - parser/xlln.js
  - parser/kytyps5.js
  - util/zarchive.js
  - parser/xllnSpa.js
  - parser/markerpatch.js
  - parser/madnesspatch.js
  - parser/pcports.js
  - parser/recompPorts.js
  - parser/recompPortTable.js
  - parser/recompPortFormats.js
  - parser/recompPortArt.js
  - parser/quiver.js
  - assets/recomp-ports.json
  - parser/runeUplay.js
  - parser/x360Recomp.js
  - parser/x360RecompState.js
  - parser/x360RecompFormats.js
  - parser/x360RecompDiscovery.js
  - parser/x360RecompSchema.js
  - parser/ps4Recomp.js
  - parser/ps4RecompTrophies.js
  - parser/ps4RecompLogs.js
  - parser/ps4RecompProgress.js
  - parser/ps4RecompConfig.js
  - parser/ps4RecompPackages.js
  - parser/ps4RecompPyInstaller.js
  - parser/ps4RecompSchema.js
  - parser/xex.js
  # Started as a worker thread or a forked process by xex.js, which cannot load it from the asar.
  - parser/xexWorker.js
  # Forked by util/scanHost.js for the same reason; what it requires stays in the asar.
  - parser/scanWorker.js
  - parser/x360Ports.js
  - parser/x360Launcher.js
  - parser/reblueBonus.js
  - util/lzx.js
  - util/xboxLiveIcons.js
  - parser/retroAchievements.js
  # Read by ff7, madnesspatch and x360Recomp for the Documents folder; registry-js is unpacked already.
  - util/reg.js
  # Where Steam installed a patched game, for markerpatch and madnesspatch.
  - parser/steamLibrary.js
  - util/steamLinux.js
  # Steam's own unlocks in appcache/stats, for the optional Steam client notifications.
  - parser/steamOfficial.js
  # Wine prefixes and the native XDG host (Linux save roots), the presence pipe name, and the
  # registry-free playtime store with the atomic writer it uses.
  - util/winHosts.js
  - util/rarityTiers.js
  - util/winePrefixes.js
  - util/wineRegistry.js
  # The XDG and Flatpak folders of the Linux emulator builds (RPCS3, shadPS4), and where an RPCS3
  # folder keeps its trophies.
  - util/xdgAppDirs.js
  - parser/rpcs3Layout.js
  # The hosts with the app's own registry reader, for the Documents folder ff7, madnesspatch,
  # runeUplay and x360Recomp read.
  - util/appHosts.js
  - util/watchdogPipe.js
  - util/playtimeFile.js
  - util/replaceFile.js
  # The save folders a GBE install redirects to, written by the library scan.
  - util/saveRedirects.js

publish:
  provider: github
  owner: Shirowwww
  repo: Achievement-Watcher-Next

win:
  icon: build/icon.ico
  # build/build.js runs this installed target first, then the portable ZIP config in a separate pass
  # so only the archive receives the marker that selects a relative data directory.
  target: nsis
  artifactName: 'Achievement.Watcher.Setup.${version}.${ext}'
  # Code signing: no trusted certificate is configured. `npm run build`
  # signs automatically when app/build/signing/Shirow.pfx exists (created by
  # build/signing/create-self-signed-cert.ps1); otherwise the build stays
  # unsigned. The Windows publisher shown to the firewall is "Shirow"
  # (CompanyName metadata + certificate subject CN=Shirow).

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  displayLanguageSelector: false
  warningsAsErrors: false
  deleteAppDataOnUninstall: false
  # The installer UI follows the Windows display language (mapped in
  # build/installer.nsh, by primary language so regional variants match too). These languages
  # match app/locale/lang/*.json - all 28, latam sharing Spanish. Every one needs its LangString
  # lines in build/installer.nsh.
  installerLanguages:
    - en_US
    - fr_FR
    - de_DE
    - es_ES
    - it_IT
    - pt_PT
    - pt_BR
    - cs_CZ
    - sk_SK
    - hu_HU
    - pl_PL
    - ru_RU
    - uk_UA
    - tr_TR
    - th_TH
    - ja_JP
    - zh_CN
    - zh_TW
    - da_DK
    - nl_NL
    - fi_FI
    - el_GR
    - id_ID
    - ko_KR
    - nb_NO
    - sv_SE
    - vi_VN
  # The installer and uninstaller window is drawn by build/x86-unicode/AwSetupUi.dll (source in
  # native/setup-ui), so there is no wizard artwork; NSIS's own pages only show if that window
  # cannot be created.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Shortcut and Control Panel entry carry the full product name - both have room for it. The
  # executable behind them keeps its historical name (see the note at the top of this file). The
  # uninstaller entry drops the version electron-builder appends by default: the product name is
  # not a version string, and the release tag already carries the number.
  shortcutName: 'Achievement Watcher Next'
  uninstallDisplayName: 'Achievement Watcher Next'
  license: build/license.txt
  differentialPackage: true

# Built on Linux by build/build-linux.js. The AppImage updates itself from latest-linux.yml in the
# same GitHub release as the Windows installer. A versioned file name is replaced by the next
# version's name on update; the autostart entry follows because startup rewrites it from $APPIMAGE.
linux:
  target: AppImage
  artifactName: 'Achievement.Watcher.${version}.${ext}'
  # The Watchdog's fallback spawn uses this name (watchdog/watchdog.js).
  executableName: achievement-watcher
  icon: resources/icon/icon.png
  category: Game
  synopsis: Achievement notifications and playtime tracking
  desktop:
    entry:
      Name: Achievement Watcher Next
      StartupWMClass: Achievement Watcher Next

# build/license.txt is the NSIS license page. Found by default, it would make the AppImage ask to
# accept the LGPL in a dialog before starting.
appImage:
  license: null

directories:
  buildResources: ./build

files:
  - '**/*'
  - '!**/*.map'
  - '!dist/**'
  # registry-js is compiled locally (npm rebuild registry-js). Only registry.node is needed at
  # runtime; the rest of build/ is ~5 MB of MSVC link artifacts and debug symbols.
  - '!node_modules/registry-js/build/**/*.{pdb,ipdb,iobj,lib,exp}'
  - '!node_modules/registry-js/build/Release/obj/**'
  - '!node_modules/registry-js/build/Release/obj.target/**'
  # Build-only signing material must never be shipped. A self-signed certificate is used only by
  # the release machine; end users do not receive or install it.
  - '!build/signing/**'
  - '!**/*.pfx'
  - '!**/*.cer'
  - '!**/.password'
  # Dev-only helpers that live beside the sources: the one-line launcher, the patch-package sources
  # (patch-package is a devDependency and never runs from an installed build) and the local agent
  # tooling, which is gitignored and has no business in a user's install directory.
  - '!runme.cmd'
  - '!electron-builder-portable.yml'
  - '!patches/**'
  - '!.agents/**'
  - '!.claude/**'
  - '!skills-lock.json'
  - '!watchdog/_wip_/**'
  - '!watchdog/patches/**'
  # Dev-only electron-updater config; packaged builds get their own generated app-update.yml.
  - '!dev-app-update.yml'
  # Bare-runtime shims (~5.6 MB). tar-fs and tar-stream reach them only through the "bare" subpath
  # import condition ("fs": { "bare": "bare-fs", "default": "fs" }); under Node and Electron that
  # always resolves to the built-in module, so these never load. Verified by removing them and
  # running a real tar-stream pack/extract round trip plus a @puppeteer/browsers load - the
  # Chromium-download path that actually uses tar-fs.
  # bare-events is NOT excluded: streamx -> events-universal requires it unconditionally.
  - '!node_modules/bare-fs/**'
  - '!node_modules/bare-url/**'
  - '!node_modules/bare-path/**'
  - '!node_modules/bare-stream/**'
  # Never loaded at runtime, ~15 MB of app.asar measured on 3.11.3:
  #   TypeScript sources and declarations (zod's src/ only answers a custom "@zod/source" condition);
  #   protobuf sources (steam-user and steam-session load their generated JS);
  #   builds Node never resolves: puppeteer-core es5-iife, moment min/src/dist (main is moment.js, its
  #   locales require '../moment'), node-unrar-js esm (the "module" field), node-html-parser umd;
  #   xml2js.bc.js, a js_of_ocaml artifact published inside xml2js 0.6.2 that lib/xml2js.js never
  #   requires (the registry tarball itself is 3.4 MB, so it is not a local oddity);
  #   node-addon-api, read only by sharp's build-from-source script.
  # Package READMEs and changelogs go too; LICENSE files stay, whatever their extension.
  - '!**/*.{ts,mts,cts}'
  - '!**/*.proto'
  - '!**/{README,Readme,readme,CHANGELOG,Changelog,changelog,HISTORY,History,history}.md'
  - '!node_modules/puppeteer-core/lib/es5-iife/**'
  - '!node_modules/moment/{min,src,dist}/**'
  - '!node_modules/node-unrar-js/esm/**'
  - '!node_modules/node-html-parser/dist/index.umd.js'
  - '!node_modules/xml2js/lib/xml2js.bc.js'
  - '!node_modules/node-addon-api/**'
  # Installer artwork and the packaging scripts are build-time only; app.asar does not need them.
  - '!build/**'

extraFiles:
  # Keep the attribution notice beside the installed application as well as in source releases.
  - from: ../NOTICE
    to: resources/NOTICE

  - from: ../watchdog
    to: ./watchdog
    # Filter globs resolve against `from`, so they must NOT be prefixed with "watchdog/" - a
    # prefixed pattern silently matches nothing and the excluded files ship anyway.
    #
    # notification-test.js is deliberately NOT excluded: websocket.js requires it at module load,
    # so dropping it from the package breaks the Watchdog's websocket module and with it the
    # Settings "test notification" buttons.
    filter:
      - '**/*'
      - '!_wip_/**'
      - '!patches/**'
      - '!test/**'

  # NOTE: the portable Node 14 runtime is gone since the A2 koffi migration. The monitor runs
  # under Electron's bundled Node runtime (see launchWatchdog in electron/init.js).

  # NOTE: ./media is gone. Its 11 .wav files were byte-identical duplicates of app/sounds/, which is
  # the folder every playback path actually resolves against (bundled app/sounds + user-imported
  # <userData>/sounds). Nothing ever read the Media/ copy, so it shipped ~3.4 MB twice - once inside
  # app.asar and once here - and checkResources() then wrote a third copy into every user profile.

  - from: ./Source
    to: resources/userData/Source
